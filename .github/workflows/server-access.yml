name: Server access

# One-off maintenance: installs the maintainer's public deploy key on the museum's
# server (82.115.51.36, user ubuntu) and reports what the server offers for hosting
# the site, so it can then be set up and managed by key. The password lives only in
# the SSH_PASSWORD secret. Results (never the password) go to annotations, which are
# readable without signing in. Re-run it from the Actions tab (Run workflow) whenever
# the key has to be installed again (for example after the server is rebuilt).
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/server-access.yml']

permissions:
  contents: read

jobs:
  access:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      HOST: 82.115.51.36
      PORT: '22'
      LOGIN: ubuntu
      SSHPASS: ${{ secrets.SSH_PASSWORD }}
    steps:
      - name: Install deploy key and report server state
        run: |
          set -u
          summary() {
            echo "$1" >> "$GITHUB_STEP_SUMMARY"
            echo "::notice title=server-access::$(echo "$1" | tr '\n' '|')"
          }
          summary "## Server access to $LOGIN@$HOST:$PORT"
          if [ -z "$SSHPASS" ]; then summary "SSH_PASSWORD secret is empty or missing"; exit 1; fi
          if ! command -v sshpass >/dev/null; then
            sudo apt-get install -y -qq sshpass >/dev/null 2>&1 \
              || { sudo apt-get update -qq >/dev/null 2>&1 && sudo apt-get install -y -qq sshpass >/dev/null 2>&1; } \
              || { summary "could not install sshpass on the runner"; exit 1; }
          fi
          cat > remote.sh <<'EOF'
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          touch ~/.ssh/authorized_keys && chmod 600 ~/.ssh/authorized_keys
          KEY='ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIN2DtZzqVPMTKnu9SEfs8RrRVffx/yV2zyKbYzrJTzn0 claude-savitsky-deploy'
          grep -qF "$KEY" ~/.ssh/authorized_keys || echo "$KEY" >> ~/.ssh/authorized_keys
          echo "deploy key installed for $(whoami)"
          echo "sudo without password: $(sudo -n true 2>/dev/null && echo yes || echo no)"
          echo "docker: $(docker --version 2>/dev/null || echo missing); groups: $(id -nG)"
          echo "nginx: $(nginx -v 2>&1 || echo missing)"
          echo "memory: $(free -m | awk '/Mem:/ {print $2" MB total, "$7" MB available"}')"
          echo "disk: $(df -h ~ | awk 'NR==2 {print $4" free"}')"
          EOF
          trimmed="$(printf '%s' "$SSHPASS" | tr -d '\r\n' | sed 's/^[[:space:]]*//; s/[[:space:]]*$//')"
          passwords="raw"
          if [ "$trimmed" != "$SSHPASS" ]; then
            summary "note: the secret has spaces or line breaks at its edges; trying it trimmed too"
            passwords="raw trimmed"
          fi
          for p in $passwords; do
            [ "$p" = trimmed ] && export SSHPASS="$trimmed"
            set +e
            out=$(sshpass -e ssh -p "$PORT" -o StrictHostKeyChecking=accept-new \
              -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no \
              -o NumberOfPasswordPrompts=1 -o ConnectTimeout=15 "$LOGIN@$HOST" 'bash -s' < remote.sh 2>&1)
            rc=$?
            set -e
            if [ $rc -eq 0 ]; then
              summary "$(echo "$out" | grep -v 'Permanently added')"
              summary "**Login OK** ($p password)"
              exit 0
            fi
            case $rc in
              5) reason="server rejected the password" ;;
              255) reason="ssh error: $(echo "$out" | tail -n 1)" ;;
              *) reason="sshpass exit code $rc: $(echo "$out" | tail -n 1)" ;;
            esac
            summary "failed ($p password): $reason"
          done
          exit 1
