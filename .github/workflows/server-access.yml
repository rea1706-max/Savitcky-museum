name: Server access

# One-off maintenance: installs the maintainer's public deploy key on the site server
# (87.192.248.137, SSH on port 2222) and reports the state of the auto-deploy, so the
# server can then be managed by key. The user is admin; the password lives only in
# the SITE_SSH_PASSWORD secret. The result (never the password) is written to the
# run summary, which is readable without signing in. Re-run it from the Actions tab
# (Run workflow) whenever the key has to be installed again.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/server-access.yml']

permissions:
  contents: read

jobs:
  access:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      HOST: 87.192.248.137
      PORT: '2222'
      SSHPASS: ${{ secrets.SITE_SSH_PASSWORD }}
      SITE_SSH_USER: ${{ secrets.SITE_SSH_USER }}
    steps:
      - name: Install deploy key and report deploy state
        run: |
          set -u
          # Annotations are readable without signing in, unlike the logs.
          summary() {
            echo "$1" >> "$GITHUB_STEP_SUMMARY"
            [ "$1" = '```' ] || echo "::notice title=server-access::$(echo "$1" | tr '\n' '|')"
          }
          summary "## Server access to $HOST:$PORT"
          if [ -z "$SSHPASS" ]; then summary "SITE_SSH_PASSWORD secret is empty"; exit 1; fi
          if ! command -v sshpass >/dev/null; then
            sudo apt-get install -y -qq sshpass >/dev/null 2>&1 \
              || { sudo apt-get update -qq >/dev/null 2>&1 && sudo apt-get install -y -qq sshpass >/dev/null 2>&1; } \
              || { summary "could not install sshpass on the runner"; exit 1; }
          fi
          # The site server's login is admin; a SITE_SSH_USER secret is tried after it.
          users="admin"
          [ -n "$SITE_SSH_USER" ] && [ "$SITE_SSH_USER" != admin ] && users="$users $SITE_SSH_USER"
          cat > remote.sh <<'EOF'
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          touch ~/.ssh/authorized_keys && chmod 600 ~/.ssh/authorized_keys
          KEY='ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIN2DtZzqVPMTKnu9SEfs8RrRVffx/yV2zyKbYzrJTzn0 claude-savitsky-deploy'
          grep -qF "$KEY" ~/.ssh/authorized_keys || echo "$KEY" >> ~/.ssh/authorized_keys
          echo "deploy key: installed for $(whoami)"
          echo "deploy timer: $(systemctl is-active savitsky-deploy.timer 2>&1)"
          for d in ~/savitsky-museum /home/*/savitsky-museum; do
            [ -d "$d/.git" ] && (cd "$d" && echo "checkout $d at $(git log -1 --format=%h 2>&1), uncommitted files: $(git status --porcelain 2>/dev/null | wc -l)")
          done
          EOF
          for u in $users; do
            summary "### Trying user \`$u\`"
            if out=$(sshpass -e ssh -p "$PORT" -o StrictHostKeyChecking=accept-new \
                -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no \
                -o ConnectTimeout=15 "$u@$HOST" 'bash -s' < remote.sh 2>&1); then
              summary '```'; summary "$out"; summary '```'
              summary "**Login OK as \`$u\`**"
              exit 0
            fi
            summary '```'; summary "$(echo "$out" | tail -n 3)"; summary '```'
          done
          summary "**No login succeeded.** Check SITE_SSH_PASSWORD (and SITE_SSH_USER)."
          exit 1
