services:
  savitsky-museum:
    build:
      context: .
      dockerfile: Dockerfile
    image: savitsky-museum:latest
    container_name: savitsky-museum
    restart: unless-stopped
    ports:
      - '127.0.0.1:3020:3000'
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_SITE_URL: https://savitsky.87-192-248-137.sslip.io
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1:3000/']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
